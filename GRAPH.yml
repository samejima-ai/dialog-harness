# GRAPH.yml — dialog-harness 実行グラフの単一情報源
#
# upgrade-spec-v6.12.0（AD-032 本実装 第 1 段 / Council 66e3d9 案B）の F1。
#
# 目的: DH の実行グラフ（ノード = skill / 確定的 script / human gate、エッジ = 起動関係・
# 条件分岐・ループ）の定義が README の mermaid / escalation-matrix の表 / 各 SKILL.md /
# *.workflow.mjs / .github/workflows の 5 箇所に分散している状態を、1 ファイルへ集約する。
# philosophy 第 1 条 §依存トポロジーの追跡可能性 が要求する DAG に実体を与える。
#
# 不変条件（upgrade-spec §不変条件）:
#   I-1 本ファイルは**判定を持たない**。「どこで誰に諮るか」の宣言であって、判定は
#       escalation-matrix の定めに従う。グラフが判定を代行し始めたら drift として検出対象。
#   I-2 本ファイルは**実装の上位ではない**。実装が正・宣言が従。乖離検出時に自動で実装を
#       書き換えない（検出のみ・是正は L0/人間）。
#   I-3 粒度は **skill / gate 単位**に固定する。SKILL.md 内部の処理ステップをノード化しない
#       （二重管理による本ファイル自身の陳腐化を構造的に排除）。
#
# 規範メタデータ（dev-env-spec.md §規範メタデータ / f5fc45 の自己適用）:
#   stage: 全段階
#   review_trigger:
#     - cycles: 6
#     - measured: G-5 の誤検出が 6 cycle 連続 0 件なら FAIL 昇格を検討
#
# 検査: harness-verifier/checks/execution_graph.py（G-1〜G-4 は FAIL / G-5 は WARN）

graph_schema: 1
version: "6.12.0"

# ---------------------------------------------------------------------------
# nodes — kind はグラフ三分類（agent / tool / human）、role は philosophy 第 7 条の
# 4 役割属性（L0 / L1 / L2 / council / support）。新分類は発明しない。
# ---------------------------------------------------------------------------
nodes:
  # --- L0 設計 ---
  - id: layer0-spec-architect
    kind: agent
    role: L0
    impl: .claude/skills/layer0-spec-architect/SKILL.md
  - id: layer0-onboarding
    kind: agent
    role: L0
    impl: .claude/skills/layer0-onboarding/SKILL.md
  - id: layer0-archeo-architect
    kind: agent
    role: L0
    impl: .claude/skills/layer0-archeo-architect/SKILL.md
  - id: layer0-reindex-librarian
    kind: agent
    role: L0
    impl: .claude/skills/layer0-reindex-librarian/SKILL.md

  # --- L1 実装 ---
  - id: layer1-autonomous-dev
    kind: agent
    role: L1
    impl: .claude/skills/layer1-autonomous-dev/SKILL.md
  - id: layer1-independent-reviewer
    kind: agent
    role: L1
    impl: .claude/skills/layer1-independent-reviewer/SKILL.md

  # --- L2 統括（REGIME 判定経由でのみ起動） ---
  - id: layer2-orchestrator
