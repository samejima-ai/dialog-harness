  # --- human gate（第 7 条 P1-P4 / 第 6 条 H1-H4 / 第 9 条 委譲レベル） ---
  - id: human-P1-発案
    kind: human
    role: L0
    gate: P1
    delegation: L-FULL
    impl: .claude/skills/layer0-spec-architect/references/philosophy.md
  - id: human-P2-ブレスト
    kind: human
    role: L0
    gate: P2
    delegation: L-FULL
