  - id: human-P4-停止介入
    kind: human
    role: L0
    gate: P4
    delegation: L-GATE
    impl: .claude/skills/crosscut-autonomous-drive/references/auto-merge-boundary.md
  - id: human-H-専管判断
    kind: human
    role: L0
    gate: H1
    delegation: L-FROZEN-PHIL
