  - id: crosscut-issue-implementer
    kind: agent
    role: support
    impl: .claude/skills/crosscut-issue-implementer/SKILL.md
  - id: crosscut-verifier-drift
    kind: agent
    role: support
    impl: .claude/skills/crosscut-verifier-drift/SKILL.md
  - id: crosscut-autonomous-drive
