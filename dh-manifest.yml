# dh-manifest.yml — DH 配布・更新の正典 boundary（v5.21.0 新設）
#
# 「どのパスが DH 所有（更新で差し替えてよい）で、どれがプロジェクト所有（絶対に触らない）か」を
# 機械可読に宣言する単一情報源。更新者（CC / crosscut-dh-self-update / 手動スクリプト）は
# 本ファイルを読み、boundary を推測せずに安全更新する。
#
# 原則:
# - DH 所有物 = 「agent 本体はプロジェクト不変」（差異は SPEC/sensors/checklist 等の入力データに閉じる）
#   ゆえに丸ごと差し替えてよい。
# - プロジェクト所有物 = そのプロジェクト固有の状態。DH 更新は決して上書きしない。
# - 更新手順の正典は UPDATE.md。本ファイルは「対象パスの分類」だけを持つ（手順は持たない）。

# DH バージョンの正典は VERSION ファイル（重複定義による drift を避けるため manifest には持たない・OC review #130 LOW）
manifest_schema: 1            # 本 manifest のスキーマ版（破壊変更時に bump）

# 後方互換の下限。更新先（本配布）がこの版より前のプロジェクトに被さる場合は
# メジャー跨ぎ移行（dh-upgrades/ の該当 upgrade-spec の移行経路）が必要。
# 比較ルール: semver の **major 部のみ**で判定する（major(VERSION) == major(project の現 DH 版) なら同一メジャー）。
# pre-release 等の素朴な文字列比較は使わない。
min_same_major_from: "5.0.0"  # v5.0.0 以降からの更新は同一メジャー＝後方互換（再 sync で可）
                              # v4.x 以前からは major 跨ぎ → 個別移行（UPDATE.md §メジャー跨ぎ参照）

paths:
  # overwrite: DH 所有。更新で「その dir 単位で sync（置換）」してよい。
  #
  # ※ merge ではなく sync（置換）にする理由: skill の rename / 削除（例 v5.0.0 の council→crosscut-council）が
  #   起きたとき、置換なら旧ファイルが orphan として残らない。rsync --delete 相当 or rm -rf && cp -r。
  #
  # ※ **置換の単位は「列挙された dir 1 つ」であって `.claude/skills/` 全体ではない**（v6.17.0 F4 / Council D-4）。
  #   `.claude/skills/` を丸ごと置換すると、利用者プロジェクトが同じ dir に持つ固有 skill（Level B）が消える。
  #   v5.0.0 が「Level B は同じ `.claude/skills/` に命名規則で論理分離」と定め、v5.21.0 が「overwrite は
  #   ディレクトリごと置換」と定めたが、両者を調停した記録が無かった。実運用は同期 8 回すべて選択同期に
  #   逃げており、正典手順は一度も使われていない。D-4 はその実運用を正典へ昇格させた。
  #
  # ※ **owned_skills は allowlist ではなく「所有の宣言」である**（Council D-4 必須随伴条件 b）。
  #   本 spec の不変条件 I-1 は「allowlist / 除外リストを作らない」と定めるが、それが禁じているのは
  #   「検査に引っかかるものを個別に免除する除外リスト」である。owned_skills は逆で、
  #   **DH が所有し配布する対象を過不足なく数え上げる宣言**であり、I-1 の但し書き
  #   「除外が必要なら宣言側に明示行を書く」に該当する。列挙から漏れた skill は「免除される」のではなく
  #   「配布されない」= 不利益を被る側に落ちるため、免除の誘因が構造的に働かない。
  #
  # ※ **単一情報源は GRAPH.yml の nodes**（Council D-4 必須随伴条件 c）。owned_skills はそこからの
  #   導出であり、harness-verifier 検査 12 が **GRAPH nodes ⇄ owned_skills ⇄ 実在 dir の三者**を
  #   決定論で突合する（GRAPH との不一致・実体との不一致をそれぞれ FAIL）。
  #   実在 dir とも突合するのは、GRAPH 自体が実体から離れる可能性を検査 7 だけに委ねないため。
  #   prefix 判定にしない理由: DH 配布の `rtk-integration` が layer/crosscut prefix を持たず破れるため
  #   （`glossary.py:250` の managed_prefixes / `execution_graph.py` G-5 と同型の欠陥。後者は F2 で除去済み）。
  overwrite:
    - "templates/"
    # v6.17.0 F4: `.claude/agents/` は DH と配布先で内容同一（実測。改行コードのみ CRLF/LF 差）だが
    # 分類行が無く既定 never_touch に落ちていた = **DH が配っても更新経路を持たない**状態だった。
    # 改行正規化: DH 側は CRLF、配布先は LF。同期時は**改行を正規化してから比較する**
    # （byte 比較すると全ファイルが差分に見え、ノイズ diff で本当の変更が埋もれる）
    - ".claude/agents/"
  # owned_skills: `.claude/skills/` 配下で DH が所有する dir の明示列挙（上記の注記を参照）。
  # ここに無い skill dir は利用者プロジェクトの所有（Level B）であり、DH 更新は触れない。
  owned_skills:
    - "crosscut-autonomous-drive"
    - "crosscut-continuous-learning"
    - "crosscut-council"
    - "crosscut-cycle-retrospective"
    - "crosscut-feedback-loop"
    - "crosscut-hook-observer"
    - "crosscut-issue-dispatcher"
    - "crosscut-issue-implementer"
    - "crosscut-issue-quality-gate"
    - "crosscut-verifier-drift"
    - "crosscut-verifier-philosophy"
    - "layer0-archeo-architect"
    - "layer0-onboarding"
    - "layer0-reindex-librarian"
    - "layer0-spec-architect"
    - "layer1-autonomous-dev"
    - "layer1-independent-reviewer"
    - "layer2-integration-verifier"
    - "layer2-orchestrator"
    - "rtk-integration"

  # merge: DH 提供だがプロジェクトがカスタムしうる。raw 上書き不可。差分を提示して人間がマージ。
  merge:
    # v6.15.x hook 配線修理: Claude Code が読むのは settings 系のみ（hooks.json は読まれない・公式仕様）。
    # settings.json は hooks の他に利用者固有設定（permissions 等）を持ちうるため raw 上書き不可の merge 分類
    - ".claude/settings.json"
    # v6.17.0 F4: DH は `.gitignore` に配布物由来の除外行を持つが、利用者プロジェクトも自分の除外行を持つ。
    # 追記マージであり raw 上書き不可（上書きすると利用者の除外が消え、意図しないファイルが git に入る）
    - ".gitignore"

  # redeploy: placeholder（${ALLOWED_AUTHORS} 等）を含むため raw コピー不可。
  # crosscut-autonomous-drive 経由で placeholder 再展開（冪等でない・衝突は明示確認）。
  redeploy:
    - ".github/workflows/"

  # never_touch: プロジェクト所有。DH 更新は絶対に書き換え・削除しない（独立性保護）。
  #
  # ※ **overwrite との優先順位**（v6.17.0 F3 / Council D-3 必須随伴条件 c）:
  #   同一パスが overwrite と never_touch の両方にマッチしうる場合、**never_touch が勝つ**。
  #   例: `.claude/skills/crosscut-council/history/` は owned_skills（crosscut-council）配下＝
  #   `.claude/skills/`（overwrite）の一部だが、`history/` にもマッチする。この規則が未定義だったため、
  #   「社外秘ゆえ skill 内部に閉じる」と宣言された COUNCIL-LOG が配布先 2 リポへ byte 一致で
  #   配られていた（実測 2026-09-06: kakuman 84,721 B / cc-cockpit 83,467 B。F3 が是正）。
  #   **判定は「より不可侵な側を採る」**: 迷ったら配らない・触らない。
  #   なお本規則を強制するコードは未実装（本ファイル末尾の注記どおり harness-verifier 側の
  #   実装余地。検査 13 は「配布物に状態を置かない」側から同じ事故を検出する）。
  never_touch:
    - "SPEC.md"
    - "DONT.md"
    - "REGIME.md"
    - "CLAUDE.md"          # プロジェクト側の CLAUDE.md（DH は配布しない）
    - "history/"           # episodic + 叡智 + 情報代謝（COLD/HOT/cursor 含む）。**任意の階層で有効**
    - "delivery/"
    - ".claude/disabled/"  # モード判定で退避された要素（プロジェクト状態）
    # 上記以外のプロジェクト固有コード・資産はすべて never_touch（明示列挙しない＝既定で不可侵）

  # unclassified_ok: 上記 4 分類のいずれにも属さないが、**それが正しい**と宣言するもの（v6.17.0 F4）。
  # 検査 8 の分類網羅検査はここに載っていない未分類パスを WARN する。
  # 「既定で never_touch に落ちる」運用自体は維持するが、**DH が配布したいものが黙って不可侵に落ちる**
  # 事故（本 v6.17.0 が (d) として検出した `.claude/agents/`）を検出できるようにするのが本節の役割。
  unclassified_ok:
    - "README.md"            # DH 本体の説明。配布しない
    - "README.en.md"
    - "UPDATE.md"            # 更新手順そのもの。読まれるが配られない
    - "VERSION"              # DH 本体の版。配布は §3 の REGIME.md 記録で行う
    - "GRAPH.yml"            # DH 自己の実行グラフ宣言。配布しない
    - "dh-manifest.yml"      # 本ファイル
    - "dh-upgrades/"         # 版ごとの移行仕様。読まれるが配られない
    - "docs/"                # DH 本体の移行ガイド
    - "harness-verifier/"    # DH 自己検査。配布しない（BOUNDARY.md / DECL-16）
    - "scripts/"             # DH 自己の検査器・分析器
    - "delivery/"            # never_touch と重複するが DH 本体側の献上物置き場
    - "skill-audit-workspace/"
    - ".git"
    - ".gitattributes"
    - ".github/"             # DH 本体の CI。配布分は redeploy の `.github/workflows/` が担う
    - ".council-ctl.json"    # CTL の投影（user-scope council-data が実体）。配布しない
    # `.claude/skills/` dir そのもの: 中身は owned_skills（DH 所有）と Level B（利用者所有）の
    # 同居であり、dir 単位では一つの分類に落とせない。判定は owned_skills が担う
    - ".claude/skills/"
    # Claude Code が実行時に作るロックファイル。git 管理外（.gitignore 済み）
    - ".claude/scheduled_tasks.lock"

# ---------------------------------------------------------------------------
# upstream — 逆流路（v7 Phase 1・Council council-2026-08-26T01:53:40Z-v7ord1）
#
# 上記 paths: の 4 分類はすべて DH → 配布先の「下り」である。DH 本体は製品を持たず
# 運用圧を受ける面を持たないため、配布先が本番事故の代償で育てた機構が根に還流しない
# （delivery/PLAN-v7-reconstruction-2026-08-26.html §構造診断）。本ブロックはその上りを定義する。
#
# paths: の中に置かない理由: paths: は「DH が配布先へ書き込む権限」の分類であり、
# upstream は逆向きの読み取りである。同一ツリーに混ぜると UPDATE.md 経路の読み手が
# 書き込み対象と誤解しうる（Council 開発者軸の懸念）。
#
# 不変条件:
#   U-1 配布先に対して**読み取り専用**。upstream-scan は配布先へ 1 バイトも書かない。
#   U-2 出力は**候補提示のみ**。DH のファイルを書き換えない（出力先の候補 md を除く）。
#   U-3 採択は**人間ゲート**。自動 merge しない（philosophy 第 6 条 人間最終承認）。
#   U-4 判定を持ち込まない。**存在差分の列挙に閉じる**（同名要素の内容比較・優劣判定はしない）。
#   U-5 還流するのは機構ではなく**それを必要とした出来事**。候補 md は事故の日付と
#       解いた問題を必須欄に持つ（Council 哲学者軸の指摘。事故を経ていない規範の自己増殖を防ぐ）。
upstream:
  # 走査対象。配布先に在って DH に無い要素を列挙する（存在差分のみ・U-4）。
  # 末尾に glob を書くと直下要素を名前で絞れる。**絞りは宣言側の責務**であり、
  # スクリプトに判定を持たせない（kakuman check-routing-gates.mjs の GATE_PATTERNS と同規律）。
  # 絞る理由: 製品リポジトリの scripts/ を丸ごと走査すると業務スクリプトが大量に混じり、
  # 「常時発火する検査は形骸化する」（kakuman が実地で得た知見）を再演する。
  scan:
    - ".claude/skills/"       # 全件（現地で育った skill は全て人間に見せる）
    - "scripts/check-*"       # 決定論センサーの命名規約のみ
    - "scripts/lint-*"        # 同上
    - ".github/workflows/"    # 全件（workflow は本数が少なく形式が要点）

  # 逆流を禁じる領域。子の規範が親の憲法を書き換える経路を作らない。
  # 候補として列挙することすらしない（P4 介入権の事後発動化を防ぐ）。
  never_upstream:
    - ".claude/skills/layer0-spec-architect/references/philosophy.md"
    - ".claude/skills/crosscut-autonomous-drive/references/auto-merge-boundary.md"
    - ".claude/skills/crosscut-autonomous-drive/references/delegation-boundary.md"
    - "dh-manifest.yml"
    - "VERSION"

  # 採択の決定権。human 固定（U-3）。この値を AI が変更してはならない。
  gate: human

# 検証: 更新後、harness-verifier と振り返り儀式で health check すること（UPDATE.md §5）。
# never_touch を侵していないかのガードは harness-verifier 側で実装余地（v5.22.0 申し送り）。
verify_after_update: true
