<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 判断キット v2 = 1 項目ずつめくる。上に地図、項目は 左 = 絵（原図＞モック＞挿絵＞表・グラフ）/ 右 = 課題・説明・質問・選択肢・メモ。
   複雑な項目は「解説」と「選ぶ」の 2 枚に分けて札を付ける。最後のページがまとめ。下に固定の帯（回答数・前へ / 次へ・コピー） */
:root {
  --bg: #f4f6f5; --panel: #ffffff; --ink: #1c2420; --muted: #5f6a65; --line: #d6ddd9;
  --accent: #1f6f5c; --accent-ink: #ffffff; --accent-soft: #e0efe9;
  --issue: #9a5b00; --issue-soft: #fbefd9; --sel: #6b4fd8; --sel-soft: #ece8fb;
  --body: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1b201e; --ink: #e4eae7; --muted: #9aa6a0; --line: #2e3633;
  --accent: #5cc0a4; --accent-ink: #0f1a16; --accent-soft: #1b3129; --issue: #f0b45a; --issue-soft: #382a14; --sel: #a995ff; --sel-soft: #2a2546; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1b201e; --ink: #e4eae7; --muted: #9aa6a0; --line: #2e3633;
  --accent: #5cc0a4; --accent-ink: #0f1a16; --accent-soft: #1b3129; --issue: #f0b45a; --issue-soft: #382a14; --sel: #a995ff; --sel-soft: #2a2546; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.7; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 18px 110px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
h1 { font-size: 21px; margin: 0; text-wrap: balance; }
h2 { font-size: 19px; margin: 0; text-wrap: balance; }
p { margin: 0; max-width: 70ch; }
.note { font-size: 13px; color: var(--muted); }
.map { display: flex; flex-wrap: wrap; gap: 6px; }
.map button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
.map button .n { min-width: 22px; height: 22px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--bg); font-size: 12px; padding: 0 4px; }
.map button[aria-current="step"] { border-color: var(--accent); color: var(--ink); font-weight: 600; }
.map button[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }
.map button.done .n { background: var(--sel); color: #fff; }
.page { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
@media (max-width: 900px) { .page { grid-template-columns: 1fr; } }
.pics { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
figure { margin: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in; }
figure iframe { width: 100%; min-height: 460px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
figcaption { font-size: 12px; color: var(--muted); }
.kind { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); margin-right: 6px; }
.kind.original { border-color: var(--accent); color: var(--accent); }
.kind.mock { border-color: var(--sel); color: var(--sel); }
.side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.head .num { font-size: 13px; font-weight: 700; color: var(--sel); }
.phase { font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 999px; }
.phase.ex { background: var(--accent-soft); color: var(--accent); }
.phase.ch { background: var(--sel-soft); color: var(--sel); }
.state { font-size: 12px; padding: 0 8px; border-radius: 999px; border: 1px dashed var(--line); color: var(--muted); margin-left: auto; white-space: nowrap; }
.state.ok { border-style: solid; border-color: var(--sel); color: var(--sel); }
.blk { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: start; }
.blk .lab { font-size: 12px; font-weight: 700; padding-top: 3px; }
.blk.issue .lab { color: var(--issue); }
.blk.explain .lab { color: var(--accent); }
.blk.ask .lab { color: var(--sel); }
.blk ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 2px; }
.blk.ask .q { font-weight: 700; }
details { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel); }
.opt input { margin-top: 5px; accent-color: var(--sel); }
.opt b { display: block; }
.opt .why { font-size: 12px; color: var(--muted); }
.opt .tag { margin-left: auto; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; height: 20px; white-space: nowrap; }
.opt:has(input:checked) { border-color: var(--sel); background: var(--sel-soft); }
.opt.off { opacity: .55; cursor: not-allowed; }
textarea { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 14px; background: var(--panel); color: var(--ink); box-sizing: border-box; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.bars { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.bars .row { display: grid; grid-template-columns: 9em 1fr 4em; gap: 8px; align-items: center; font-size: 13px; }
.bars .track { height: 14px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); }
.bars .v { text-align: right; font-variant-numeric: tabular-nums; }
.sum { grid-template-columns: 1fr; }
pre { white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--mono); font-size: 12px; max-height: 340px; overflow: auto; margin: 0; }
.btn { height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, .opt:focus-within, textarea:focus-visible, .map button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.bar { flex-wrap: wrap; position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; z-index: 10; }
.bar .cnt { font-size: 14px; font-variant-numeric: tabular-nums; }
.zoom { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: grid; place-items: center; z-index: 20; padding: 16px; }
.zoom img { max-width: 100%; max-height: 100%; background: #fff; }
</style>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p class="note" id="lede"></p>
    <p class="note" id="meta"></p>
  </header>
  <nav class="map" id="map" aria-label="項目"></nav>
  <main id="page"></main>
</div>
<div class="bar"><span class="cnt" id="cnt"></span><button class="btn" id="prev">← 前へ</button><button class="btn primary" id="next">次へ →</button><span style="margin-left:auto"></span><button class="btn" id="copy2">まとめをコピー</button></div>
<script>
(() => {
  const SPEC = /*SPEC*/;
  // raw = 書き手の文（<b> などの HTML を通す）/ esc = 人が打った文（メモ）。メモは必ず esc
  const raw = (s) => String(s ?? '');
  const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const KIND = { original: '原図', mock: 'モック', illustration: '挿絵', table: '表', chart: 'グラフ' };
  // ページ = 項目ごとに 1 枚（phases の項目は 解説 / 選ぶ の 2 枚）+ 最後のまとめ
  const PAGES = [];
  SPEC.items.forEach((it, i) => {
    if (it.phases) { PAGES.push({ it, i, ph: 'ex' }); PAGES.push({ it, i, ph: 'ch' }); }
    else PAGES.push({ it, i, ph: 'all' });
  });
  PAGES.push({ sum: true });
  const ans = {}; const memo = {};
  let cur = 0;
  document.getElementById('title').textContent = SPEC.title;
  document.getElementById('lede').innerHTML = raw(SPEC.lede);
  document.getElementById('meta').innerHTML = (SPEC.meta ?? []).join(' ・ ');

  function visual(v) {
    const cap = `<figcaption><span class="kind ${v.kind}">${KIND[v.kind] ?? v.kind}</span>${esc(v.caption)}</figcaption>`;
    if (v.kind === 'table') return `<figure><div class="tbl"><table><thead><tr>${v.columns.map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>${v.rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${cap}</figure>`;
    if (v.kind === 'chart') { const mx = Math.max(...v.bars.map((b) => b.value), 1); return `<figure><div class="bars">${v.bars.map((b) => `<div class="row"><span>${b.label}</span><span class="track"><span class="fill" style="display:block;width:${(b.value / mx) * 100}%"></span></span><span class="v">${b.value}${v.unit ?? ''}</span></div>`).join('')}</div>${cap}</figure>`; }
    if (v.kind === 'mock' && v.html) return `<figure><iframe title="${esc(v.caption)}" sandbox="allow-scripts" srcdoc="${v.html.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}"></iframe>${cap}</figure>`;
    if (v.kind === 'mock' && v.url) return `<figure>${v.src ? `<img alt="${esc(v.caption)}" src="${v.src}">` : ''}<a class="btn primary" style="display:inline-flex;align-items:center;width:max-content;text-decoration:none" href="${v.url}" target="_blank" rel="noopener">触れるモックを開く</a>${cap}</figure>`;
    return `<figure><img alt="${esc(v.caption)}" src="${v.src}">${cap}</figure>`;
  }
  function render() {
    const p = PAGES[cur];
    const el = document.getElementById('page');
    if (p.sum) {
      el.innerHTML = `<section class="page sum" aria-label="まとめ"><h2>まとめ</h2>
        <div class="tbl"><table><thead><tr><th>項目</th><th>答え</th><th>メモ</th></tr></thead><tbody>${SPEC.items.map((it) => { const a = ans[it.id]; return `<tr><td>${it.id} ${it.title}</td><td>${a ? a.map((k) => `${k} ${it.options.find((o) => o.k === k).label.replace(/<[^>]+>/g, '')}`).join(' / ') : (it.rec ? `未回答（AI推奨 ${it.rec}）` : '未回答')}</td><td>${esc(memo[it.id])}</td></tr>`; }).join('')}</tbody></table></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="copy">回答まとめをコピー</button><span class="note">コピーして会話に貼り戻すと、その答えのとおりに実行します。未回答は AI推奨で進めます。</span></div>
        <pre id="prompt"></pre></section>`;
      document.getElementById('prompt').textContent = prompt();
      document.getElementById('copy').addEventListener('click', (e) => copy(e.currentTarget, '回答まとめをコピー'));
    } else {
      const { it, i, ph } = p;
      const showEx = ph !== 'ch'; const showCh = ph !== 'ex';
      const multi = !!it.multi;
      const phaseTag = ph === 'ex' ? '<span class="phase ex">解説</span>' : ph === 'ch' ? '<span class="phase ch">選ぶ</span>' : '';
      el.innerHTML = `<section class="page" aria-labelledby="h-${it.id}">
        <div class="pics">${it.visuals.map(visual).join('')}</div>
        <div class="side">
          <div class="head"><span class="num">${i + 1} / ${SPEC.items.length}</span>${phaseTag}<h2 id="h-${it.id}">${it.title}</h2><span class="state${ans[it.id] ? ' ok' : ''}">${ans[it.id] ? `回答 ${ans[it.id].join('・')}` : '未回答'}</span></div>
          ${showEx ? `<div class="blk issue"><span class="lab">課題</span><p>${it.issue}</p></div>
          <div class="blk explain"><span class="lab">説明</span><ul>${it.explain.map((e) => `<li>${e}</li>`).join('')}</ul></div>
          ${it.more ? `<details><summary>▸ 詳しく</summary><p>${it.more}</p></details>` : ''}` : ''}
          ${ph === 'ex' ? '<p class="note">次のページで選びます（「次へ」）。</p>' : ''}
          ${showCh ? `<div class="blk ask"><span class="lab">質問</span><p class="q">${it.question}</p></div>
          <div class="opts" role="${multi ? 'group' : 'radiogroup'}" aria-label="${it.question.replace(/<[^>]+>/g, '')}">${it.options.map((o) => `<label class="opt${o.disabled ? ' off' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="${it.id}" value="${o.k}"${(ans[it.id] ?? []).includes(o.k) ? ' checked' : ''}${o.disabled ? ' disabled' : ''}><span><b>${o.k}　${o.label}</b><span class="why">${o.why ?? ''}</span></span>${it.rec && o.k === it.rec ? '<span class="tag">AI推奨</span>' : ''}</label>`).join('')}</div>
          <textarea data-id="${it.id}" placeholder="メモ（任意）">${esc(memo[it.id])}</textarea>` : ''}
        </div></section>`;
      el.querySelectorAll('input').forEach((x) => x.addEventListener('change', () => {
        const v = [...el.querySelectorAll(`input[name="${it.id}"]:checked`)].map((y) => y.value);
        if (v.length) ans[it.id] = v; else delete ans[it.id];
        render();
        // 描き直した後も、押した選択肢にフォーカスを戻す（↑↓ で選び続けられる）
        document.querySelector(`#page input[name="${it.id}"][value="${x.value}"]`)?.focus();
      }));
      const ta = el.querySelector('textarea'); if (ta) ta.addEventListener('input', () => { memo[it.id] = ta.value; });
      el.querySelectorAll('figure img').forEach((img) => img.addEventListener('click', () => {
        const z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = `<img alt="" src="${img.src}">`; z.addEventListener('click', () => z.remove()); document.body.appendChild(z);
      }));
    }
    // 地図と帯
    document.getElementById('map').innerHTML = PAGES.map((q, k) => {
      if (q.sum) return `<button data-k="${k}"${k === cur ? ' aria-current="step"' : ''}><span class="n">✓</span>まとめ</button>`;
      if (q.ph === 'ch') return '';
      return `<button data-k="${k}"${(k === cur || (PAGES[cur].it === q.it)) ? ' aria-current="step"' : ''} class="${ans[q.it.id] ? 'done' : ''}"><span class="n">${q.i + 1}</span>${q.it.title}</button>`;
    }).join('');
    document.querySelectorAll('#map button').forEach((b) => b.addEventListener('click', () => { cur = Number(b.dataset.k); render(); window.scrollTo({ top: 0 }); }));
    const n = SPEC.items.filter((it) => ans[it.id]).length;
    document.getElementById('cnt').textContent = `回答 ${n} / ${SPEC.items.length}`;
    document.getElementById('prev').disabled = cur === 0;
    const nx = document.getElementById('next'); nx.disabled = cur === PAGES.length - 1; nx.textContent = cur === PAGES.length - 2 ? 'まとめへ →' : '次へ →';
  }
  function prompt() {
    const lines = [SPEC.summaryTitle, ''];
    SPEC.items.forEach((it) => {
      const a = ans[it.id];
      const recOpt = it.options.find((o) => o.k === it.rec);
      lines.push(`${it.id} ${it.title}: ${a ? a.map((k) => `${k}（${it.options.find((o) => o.k === k).label.replace(/<[^>]+>/g, '').slice(0, 40)}）`).join(' / ') : recOpt ? `未回答（AI推奨 ${recOpt.k}: ${recOpt.label.replace(/<[^>]+>/g, '').slice(0, 40)}）` : '未回答'}`);
      if (memo[it.id]) lines.push(`  メモ: ${memo[it.id]}`);
    });
    lines.push('', SPEC.summaryFooter);
    return lines.join('\n');
  }
  async function copy(btn, label) {
    const t = prompt();
    try { await navigator.clipboard.writeText(t); btn.textContent = 'コピーしました'; }
    catch { cur = PAGES.length - 1; render(); const pre = document.getElementById('prompt'); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '選択しました（Ctrl+C でコピー）'; }
    setTimeout(() => (btn.textContent = label), 2500);
  }
  document.getElementById('prev').addEventListener('click', () => { if (cur > 0) { cur--; render(); window.scrollTo({ top: 0 }); } });
  document.getElementById('next').addEventListener('click', () => { if (cur < PAGES.length - 1) { cur++; render(); window.scrollTo({ top: 0 }); } });
  document.getElementById('copy2').addEventListener('click', (e) => copy(e.currentTarget, 'まとめをコピー'));
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLTextAreaElement || (e.target instanceof HTMLInputElement && e.target.type === 'text')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    // 選択肢にフォーカスがある間の ← → はブラウザの選択の移動に任せる（ページはめくらない）
    if (e.target instanceof HTMLInputElement && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return;
    if (e.key === 'ArrowRight' && cur < PAGES.length - 1) { cur++; render(); }
    if (e.key === 'ArrowLeft' && cur > 0) { cur--; render(); }
    const p = PAGES[cur];
    if (p.it && p.ph !== 'ex' && /^[a-dA-D1-4]$/.test(e.key)) {
      const o = /[1-4]/.test(e.key) ? p.it.options[Number(e.key) - 1] : p.it.options.find((y) => y.k === e.key.toUpperCase());
      if (!o || o.disabled) return;
      if (p.it.multi) { const s = new Set(ans[p.it.id] ?? []); s.has(o.k) ? s.delete(o.k) : s.add(o.k); if (s.size) ans[p.it.id] = [...s]; else delete ans[p.it.id]; }
      else ans[p.it.id] = [o.k];
      render();
    }
  });
  render();
})();
</script>
