# skill-triggers.yml — skill routing のトリガー評価集合（upgrade-spec v7.0.0 Phase A F3・基準値の凍結用）
#
# 目的: description 圧縮（PR-3）の前に routing の基準値を取る（I-5: 基準凍結 → 測定 → 劣化した分だけ戻す）。
# Council `council-2026-09-13T01:40:00Z-v7phsa`（案C）の順序: fixtures 執筆 → 凍結 → 圧縮 → 再測定。
# 本ファイルは**圧縮後の文言を見る前に**書いた（測定器を答えに合わせない・哲学者条件）。
#
# 形式: skill ごとに positive（起動すべき発話）8 件・negative（起動してはならない発話）8 件。
# negative は主に兄弟 skill の positive（混同ケース）から取る。
#
# 測定プロトコル（事前宣言・LLM 実測は harness-verifier の検査対象外 = I-3）:
#   - 実行主体: L1 が献上時に 1 回。各発話を新規セッションの skill 一覧（description のみ）に提示し、
#     「起動する skill を 1 つ選ぶ / 該当なし」を回答させる
#   - 反復: 3 run。基準値は 3 run の平均と揺れ幅（max−min）を DELIVERY に記録する
#   - 指標: 正例再現率 = 正しい skill を選んだ positive / positive 総数、負例誤発火率 = 当該 skill を選んだ negative / negative 総数
#   - 劣化判定（PR-3 再測定時）: 正例再現率が基準より **5pt 超**低下、または負例誤発火率が **5pt 超**上昇。
#     ただし基準の揺れ幅が 5pt を超える指標は閾値を揺れ幅に置き換える（偽陽性で戻し過ぎない）
#   - 基準値は **PR-1 merge 後の master**（F2 で一覧が変わった後の 17 skill 構成）で取る（Council 重み 8 vs 2）
#
# 規範メタデータ: `{ stage: 全段階, review_trigger: [model_generation, measured: 負例誤発火率が圧縮前より悪化] }`

version: 1
