      - リファクタしたい。自分で書いたコードの意図が分からなくなった
      - 既存プロジェクトを harness 化したい。後付けで onboarding して
      - Issue にして
      - drift チェックを走らせて
      - 今回の cycle を振り返って改善点を出して
      - history が重い。reindex して
      - Council に諮って

