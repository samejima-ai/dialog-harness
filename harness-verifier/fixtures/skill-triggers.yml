      - DB を使うか迷っている。保存が要るか決まっていない
      - M2 と L2 の境界が分からない。判定して
      - L0-5 認可サブフェーズを起動して
      - dev_mode を github_assisted から autonomous に昇格したい。ADR 込みで
      - L0 メタハーネス開発を開始する。DH の刷新を設計したい
    negative:
